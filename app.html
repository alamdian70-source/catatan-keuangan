<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2358">
<meta name="color-scheme" content="light">
<title>Catatan Keuangan By Alam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0A2358;--navy2:#1A4BA0;--blue:#1B66D1;--blue-d:#1556B3;--gold:#E3AE2F;
  --bg:#F1F4F9;--card:#fff;--line:#E1E6EF;--ink:#0F1B33;--muted:#5F6B85;--soft:#F7F9FC;
  --in:#12805C;--out:#C8312F;--as:#1B66D1;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
.in{color:var(--in)}.out{color:var(--out)}.as{color:var(--as)}

/* ===== shell ===== */
.shell{min-height:100vh}
.side{display:none}
.mtop{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;line-height:1.15}
.logo svg{width:32px;height:32px;flex:none}
.logo small{display:block;font-weight:400;font-size:11.5px;opacity:.7;margin-top:1px}
.ghost-w{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;display:flex;align-items:center;gap:6px}
.ghost-w svg{width:15px;height:15px}
.main{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:1120px;margin:0 auto}
.pg-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.greet{color:var(--muted);font-size:13px}
.pg-h h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.mo{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.mo input{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
#st{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);position:relative}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--blue);font-weight:600}
.bnav button.on::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}

@media (min-width:900px){
  .shell{display:grid;grid-template-columns:252px 1fr}
  .side{display:flex;flex-direction:column;background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}
  .side .logo{padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:16px}
  .side nav{display:grid;gap:4px}
  .side nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:rgba(255,255,255,.72);padding:11px 12px;border-radius:8px;font-size:14.5px;text-align:left;position:relative}
  .side nav button svg{width:20px;height:20px}
  .side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  .side nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
  .side nav button.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
  .side .foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 8px 0;font-size:12.5px;color:rgba(255,255,255,.7)}
  .side .foot b{display:block;color:#fff;font-weight:500;overflow-wrap:anywhere;margin-bottom:10px}
  .mtop,.bnav{display:none}
  .main{padding:30px 36px 40px}
  .pg-h h1{font-size:26px}
}

/* ===== cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(10,35,88,.04)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 18px 0}
.card-h h2{font-size:15.5px;font-weight:600}
.card-h span,.card-h b{font-size:13px;color:var(--muted);font-weight:400}
.card-h b{color:inherit;font-weight:700;font-size:15px}
.pad{padding:16px 18px 18px}

.acct{position:relative;overflow:hidden;color:#fff;border-radius:14px;padding:22px 22px 0;background:linear-gradient(135deg,#0A2358 0%,#17408F 100%);border-top:3px solid var(--gold);margin-bottom:16px}
.acct::after{content:"";position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 68%);pointer-events:none}
.acct .al{font-size:13px;opacity:.78}
.acct .ab{font-size:clamp(30px,8.5vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 4px;word-break:break-all}
.acct .ab small{font-size:.5em;font-weight:500;opacity:.75;margin-right:6px}
.acct .au{font-size:12.5px;opacity:.65}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:20px -22px 0;border-top:1px solid rgba(255,255,255,.16)}
.stats>div{padding:14px 22px 16px;min-width:0}
.stats>div+div{border-left:1px solid rgba(255,255,255,.16)}
.stats span{display:block;font-size:12px;opacity:.72}
.stats b{display:block;font-size:14.5px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.stats .i b{color:#8BE5BC}.stats .o b{color:#FFA3A0}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:500;text-align:center}
.quick button:hover{border-color:#C5D3EC;background:var(--soft)}
.quick .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#E8F0FD;color:var(--blue)}
.quick .ic svg{width:19px;height:19px}

.grid2{display:grid;gap:16px;margin-bottom:16px}
@media (min-width:900px){.grid2{grid-template-columns:1.25fr 1fr}}

/* bar chart */
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:150px;padding:18px 4px 0}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bc .pair{display:flex;align-items:flex-end;gap:4px;height:118px}
.bc .pair i{display:block;width:14px;border-radius:3px 3px 0 0;min-height:2px}
.bc .pair .a{background:var(--in)}.bc .pair .b{background:var(--out)}
.bc span{font-size:12px;color:var(--muted)}
.bc.cur span{color:var(--ink);font-weight:600}
.leg{display:flex;gap:16px;font-size:12.5px;color:var(--muted);padding:12px 18px 16px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* donut */
.dn{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{position:relative;width:148px;height:148px;border-radius:50%;flex:none}
.donut::after{content:"";position:absolute;inset:24px;background:#fff;border-radius:50%}
.donut div{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted)}
.donut div b{font-size:16px;color:var(--ink);font-weight:700}
.lgd{flex:1;min-width:170px}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:9px;align-items:center;padding:6px 0;font-size:13.5px}
.lg em{font-style:normal;color:var(--muted);font-size:12.5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.empty{color:var(--muted);padding:26px 18px;text-align:center;font-size:14px}

/* table */
.tbl{margin-top:12px}
.tr{display:grid;grid-template-columns:84px 1fr 150px 150px 72px;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.tr.na{grid-template-columns:1fr 160px 150px 72px}
.tr.rc{grid-template-columns:84px 1fr 110px 150px}
.tr.th{background:var(--soft);color:var(--muted);font-size:12.5px;padding-top:9px;padding-bottom:9px;font-weight:500}
.tr .r{text-align:right}
.tn{font-weight:500;overflow-wrap:anywhere}
.msub{display:none;color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px}
.amt{font-weight:600;white-space:nowrap}
.del{background:none;border:0;color:#9AA5BC;padding:6px;border-radius:6px;display:flex}
.del svg{width:16px;height:16px}
.del:hover{color:var(--out);background:#FDECEC}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:500}
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.mk>div{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--soft)}
.mk span{display:block;font-size:12.5px;color:var(--muted)}
.mk b{display:block;font-size:17px;margin-top:3px}
.mk em{font-style:normal;font-size:12.5px;font-weight:600}
.mk em.up{color:var(--in)}.mk em.dn{color:var(--out)}.mk em.nt{color:var(--muted);font-weight:400}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.seg button{background:#fff;border:1px solid #CBD3E2;border-radius:8px;padding:10px 6px;font-size:14px;font-weight:500;color:var(--ink)}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.alloc{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 10px}
.alloc i{display:block;height:100%}
.al-r{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;font-size:14px}
.al-r .sw{width:10px;height:10px;border-radius:3px}
.al-r small{color:var(--muted)}
.note{border-left:4px solid var(--gold);background:#FFF8E6;border-radius:6px;padding:12px 14px;font-size:13.5px;line-height:1.55;margin-top:12px}
.note.ok{border-color:var(--in);background:#E9F7F1}
.ins{display:grid;gap:10px;margin-top:12px}
.ins>div{border:1px solid var(--line);border-radius:10px;padding:14px}
.ins h3{margin:0 0 4px;font-size:15px}
.ins p{margin:4px 0;font-size:13.5px;line-height:1.55;color:var(--muted)}
.ins .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ins .meta span{font-size:12px;background:#E8F0FD;color:var(--blue);border-radius:99px;padding:2px 9px}
.ins a{font-size:13px;color:var(--blue)}
.ch svg{width:100%;height:190px;display:block;margin-top:12px}
.ch .st{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-top:8px}
.ch .st b{color:var(--ink);font-weight:600}
.ch .big{font-size:22px;font-weight:700;margin-top:12px}
.ch .seg{grid-template-columns:repeat(4,1fr)}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg.s5{grid-template-columns:repeat(5,1fr)}
.ch .row2{margin-top:10px}.ch .row2 input{flex:1}
.nv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.nv .full{grid-column:1/-1}
.nvr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
@media (max-width:700px){.ch .seg.s5{grid-template-columns:repeat(3,1fr)}.nv{grid-template-columns:1fr}}
.lk{margin-top:14px;display:grid;gap:2px}
.lk b{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.lk a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:14px;color:var(--blue);text-decoration:none;background:#fff}
.lk a:hover{background:var(--soft);border-color:#C5D3EC}
.disc{font-size:12.5px;color:var(--muted);line-height:1.6;margin:16px 2px}
@media (max-width:700px){.mk{grid-template-columns:1fr}.bnav button{font-size:10.5px;padding:9px 0 8px}}
.tag.in{background:#E3F5EE}.tag.out{background:#FCE9E8}.tag.tf{background:#E8F0FD}
.amt.tf{color:var(--blue)}
.acts{display:flex;justify-content:flex-end;gap:2px}
.del.ed:hover{color:var(--blue);background:#E8F0FD}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.err{font-size:13px;color:var(--out);min-height:0}
.btn.cn{margin-top:8px}
@media (max-width:700px){
  .tr,.tr.na,.tr.rc{grid-template-columns:1fr auto 66px;gap:4px 10px;padding:12px 16px}
  .tr.rc{grid-template-columns:1fr auto}
  .tr.th{display:none}
  .tr .c-d,.tr .c-k{display:none}
  .msub{display:block}
  .tr .c-a{text-align:right}
}

/* form */
.two{display:grid;gap:16px;align-items:start}
@media (min-width:900px){.two{grid-template-columns:340px 1fr}.two .form{position:sticky;top:20px}}
.fg{display:grid;gap:12px;margin-top:14px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:500}
label.f>span{display:block;margin-bottom:5px}
input,select{width:100%;background:#fff;border:1px solid #CBD3E2;border-radius:8px;padding:11px 12px;font-size:15px;min-width:0;color:var(--ink)}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,102,209,.15);outline:none}
.af{position:relative}
.af em{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px;pointer-events:none}
.af input{padding-left:38px;font-weight:600}
.btn{width:100%;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:12px;font-weight:600;font-size:15px}
.btn:hover{background:var(--blue-d)}
.btn.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.sec:hover{background:#F0F6FF}

/* auth */
.auth{min-height:100vh;display:grid}
.auth-l{background:linear-gradient(150deg,#0A2358,#17408F);color:#fff;padding:calc(26px + env(safe-area-inset-top,0px)) 24px 28px;border-bottom:3px solid var(--gold)}
.auth-l h1{font-size:24px;line-height:1.25;margin:22px 0 10px;font-weight:700;letter-spacing:-.01em;max-width:420px}
.auth-l p{opacity:.8;max-width:420px}
.auth-r{padding:24px 20px;display:flex;flex-direction:column;justify-content:center}
.auth-r form{width:100%;max-width:380px;margin:0 auto;display:grid;gap:14px}
.auth-r h2{font-size:21px;font-weight:700}
.auth-r .sub{color:var(--muted);margin-top:-8px}
#lm{font-size:13px;color:var(--out);min-height:18px}
.lock{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12.5px;justify-content:center;margin-top:4px}
.lock svg{width:15px;height:15px;flex:none}
@media (min-width:900px){
  .auth{grid-template-columns:1.05fr 1fr}
  .auth-l{padding:48px 56px;border-bottom:0;border-right:3px solid var(--gold);display:flex;flex-direction:column;justify-content:space-between}
  .auth-l h1{font-size:34px;margin:0 0 14px}
}
/* ilustrasi */
.il{display:block;width:100%;max-width:360px;height:auto;margin:0 auto}
.il-wrap{margin-top:14px}
.auth-l .il{max-width:250px}
.auth-l p{display:none}
@media (min-width:900px){.auth-l .il{max-width:440px}.auth-l p{display:block}.il-wrap{margin-top:0}}
.welcome{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;background:linear-gradient(135deg,#0A2358,#17408F);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px;border-top:3px solid var(--gold)}
.welcome>div:first-child{flex:1 1 260px}
.welcome h2{font-size:19px;font-weight:700;margin-bottom:6px}
.welcome p{opacity:.82;margin-bottom:14px;max-width:420px}
.welcome .btn{width:auto;padding:11px 20px}
.welcome .il{max-width:260px;flex:0 1 260px}
.cs{display:none;position:absolute;right:26px;top:14px;width:88px;height:88px;pointer-events:none}
@media (min-width:600px){.cs{display:block}}
@media (prefers-reduced-motion:no-preference){
  .acct,.card{animation:fade .35s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .il .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .il .trend{stroke-dasharray:160;stroke-dashoffset:160;animation:draw 1.1s .8s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .il .dot{transform-box:fill-box;transform-origin:center;animation:pop .4s 1.8s both}
  @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
  .il .coin,.cs .coin{animation:floaty 3.2s ease-in-out infinite}
  .il .coin.c2,.cs .coin.c2{animation-delay:-1.1s}
  .il .coin.c3,.cs .coin.c3{animation-delay:-2.1s}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .il .arm{transform-box:fill-box;transform-origin:100% 100%;animation:point 2.8s ease-in-out infinite}
  @keyframes point{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
  .il .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:.95;transform:scale(1)}}
}
/* emas */
.gh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gl{font-size:13px;color:var(--muted)}
.gp{font-size:26px;font-weight:700;letter-spacing:-.01em;color:#8A6410;margin:2px 0;line-height:1.2}
.gs{font-size:12.5px;color:var(--muted)}
.gtot{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.gtot b{font-weight:600}
.gset{margin-top:12px;font-size:13.5px}
.gset summary{cursor:pointer;color:var(--blue);font-weight:500}
.gset .fg2{display:grid;gap:12px;margin-top:12px}
.gset p{color:var(--muted);font-size:12.5px;margin-top:10px}
.btn.sm{width:auto;padding:8px 14px;font-size:13.5px;white-space:nowrap}
.row2{display:flex;gap:8px}.row2 input{flex:1}
.gd{font-size:12.5px;color:var(--muted)}
.up{color:var(--in);font-weight:500}.dn{color:var(--out);font-weight:500}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.goldline{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:14px 18px;margin-bottom:16px}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ====== DATA SUPABASE ====== */
var SB_URL="https://howsfdyflolnavdqasuz.supabase.co";
var SB_KEY="sb_publishable_RwWHA1A6YrMJPqshWxNZag_ehM4aLAA";
/* =========================== */

var CATS={in:["Gaji","Usaha","Bonus","Lainnya"],out:["Makan","Transport","Tagihan","Belanja","Kesehatan","Pendidikan","Lainnya"],as:["Kas/Bank","Emas","Perak","Investasi","Kendaraan","Properti","Lainnya"],tf:["Transfer"]};
var TITLE={sum:"Ringkasan",in:"Pemasukan",out:"Pengeluaran",tf:"Transfer",as:"Aset",inv:"Investasi Syariah"};
var SHORT={sum:"Ringkasan",in:"Masuk",out:"Keluar",tf:"Transfer",as:"Aset",inv:"Investasi"};
var FORMT={in:"Catat pemasukan",out:"Catat pengeluaran",as:"Catat aset",tf:"Transfer antar rekening"};

function animateTo(el,to){
  if(!el||window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  var t0=null,dur=800;
  function step(ts){if(!t0)t0=ts;var p=Math.min((ts-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=num(to*e);if(p<1)requestAnimationFrame(step);else el.textContent=num(to)}
  requestAnimationFrame(step);
}

var BR={
  "antam":{n:"Antam",m:"au"},"ubs":{n:"UBS",m:"au"},"g24":{n:"Galeri24",m:"au"},"star":{n:"Stargold",m:"au"},"au-lain":{n:"Emas lainnya",m:"au"},
  "ag-antam":{n:"Perak Antam",m:"ag"},"ag-lain":{n:"Perak lainnya",m:"ag"}
};
var BRK=Object.keys(BR);
function brandOf(x){return x.brand&&BR[x.brand]?x.brand:(x.cat==="Perak"?"ag-lain":"au-lain")}
function fmtGram(n){return (Math.round(n*100)/100).toLocaleString("id-ID")}
function spotGram(m){
  if(!SP||!(SP.fx>0)||!(SP[m]>0))return 0;
  return SP[m]*SP.fx/31.1034768;
}
/* harga per gram: harga acuan merek (buyback, atau jual jika buyback kosong) yang digeser mengikuti harga dunia */
function unitPrice(x){
  var b=brandOf(x),sp=spotGram(BR[b].m),e=PB[b];
  if(e&&(e.bb>0||e.jl>0)){
    var base=e.bb>0?e.bb:e.jl,ratio=(sp>0&&e.spot>0)?sp/e.spot:1;
    return {p:base*ratio,mode:"acuan"};
  }
  if(sp>0)return {p:sp,mode:"dunia"};
  return null;
}
/* rekening: aset non-logam. Saldo = nilai awal + pemasukan - pengeluaran +/- transfer yang dikaitkan */
function accts(){return S.items.filter(function(x){return x.type==="as"&&!(x.grams>0)})}
function accName(id){var a=S.items.filter(function(x){return x.id===id&&x.type==="as"})[0];return a?(a.note||a.cat):"(rekening dihapus)"}
function mv(id){
  var t=0;
  S.items.forEach(function(i){
    if(i.type==="in"&&i.acc===id)t+=i.amount;
    else if(i.type==="out"&&i.acc===id)t-=i.amount;
    else if(i.type==="tf"){if(i.to===id)t+=i.amount;if(i.from===id)t-=i.amount}
  });
  return t;
}
function valueOf(x){
  if(x.type==="as"){
    if(x.grams>0){
      var u=unitPrice(x);
      if(u)return x.grams*u.p*(brandOf(x)==="au-lain"?((x.karat||24)/24):1);
      return x.amount||0;
    }
    return (x.amount||0)+mv(x.id);
  }
  return x.amount||0;
}
function descOf(x){
  if(x.type==="tf")return {t:accName(x.from)+" \u2192 "+accName(x.to),s:x.note||"Transfer"};
  var a=(x.type==="in"||x.type==="out")&&x.acc?" \u00b7 "+esc(accName(x.acc)):"";
  return {t:esc(x.note||x.cat),s:esc(x.cat)+a};
}
function goldOwned(){
  var o={au:{g:0},ag:{g:0},v:0};
  S.items.forEach(function(x){if(x.type==="as"&&x.grams>0){o[BR[brandOf(x)].m].g+=x.grams;o.v+=valueOf(x)}});
  return o;
}
function goldDetail(x){
  if(x.type!=="as"||!(x.grams>0))return "";
  var b=brandOf(x),u=unitPrice(x),v=valueOf(x);
  var t=BR[b].n+" · "+fmtGram(x.grams)+" g"+(b==="au-lain"?" · "+(x.karat||24)+"K":"");
  if(!u)t+=" · harga belum tersedia";
  else{
    if(x.amount>0){
      var d=v-x.amount,sg=d>=0?"+":"−";

async function fetchGold(force){
  var fresh=SP&&SP.updated&&(Date.now()-new Date(SP.updated).getTime()<3*3600*1000);
  if(fresh&&!force)return;
  gMsg="";
  try{
    var rs=await Promise.all([fetch("https://api.gold-api.com/price/XAU"),fetch("https://api.gold-api.com/price/XAG"),fetch("https://open.er-api.com/v6/latest/USD")]);
    if(!rs[0].ok||!rs[1].ok||!rs[2].ok)throw new Error("http");
    var a=await rs[0].json(),sv=await rs[1].json(),f=await rs[2].json(),fx=f&&f.rates&&f.rates.IDR;
    if(!(a.price>0&&sv.price>0&&fx>0))throw new Error("data");

    gMsg=SP?"Gagal memperbarui harga dunia, memakai data terakhir.":"Harga dunia belum bisa dimuat. Isi harga hari ini per merek secara manual.";

function pushHist(){
  if(!SP)return;
  var now=Date.now(),last=HIST[HIST.length-1];
  if(last&&now-last.t<6*3600*1000)return;
  HIST.push({t:now,au:spotGram("au"),ag:spotGram("ag"),fx:SP.fx});
  HIST=HIST.filter(function(h){return now-h.t<10*86400*1000}).slice(-40);
  lsWrite("metalHist",JSON.stringify(HIST));
}
function chg(key,cur){
  if(!(cur>0))return null;
  var now=Date.now(),best=null;
  HIST.forEach(function(h){
    var age=now-h.t;
    if(age>=18*3600*1000&&age<=60*3600*1000&&h[key]>0&&(!best||Math.abs(age-24*3600*1000)<Math.abs(now-best.t-24*3600*1000)))best=h;
  });
  return best?(cur/best[key]-1)*100:null;
}

function lineChart(pts,f,label){
  var W=600,H=190,pl=6,pr=6,pt=12,pb=12,lo=Infinity,hi=-Infinity;
  pts.forEach(function(p){lo=Math.min(lo,p[1]);hi=Math.max(hi,p[1])});
  if(hi===lo){hi+=1;lo-=1}
  var t0=pts[0][0],t1=pts[pts.length-1][0],dt=(t1-t0)||1;
  function X(t){return pl+(t-t0)/dt*(W-pl-pr)}
  function Y(v){return pt+(1-(v-lo)/(hi-lo))*(H-pt-pb)}
  var d=pts.map(function(p,i){return (i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)}).join(" ");
  var first=pts[0][1],last=pts[pts.length-1][1],up=last>=first,col=up?"var(--in)":"var(--out)";
  var area=d+" L"+X(t1).toFixed(1)+" "+(H-pb)+" L"+X(t0).toFixed(1)+" "+(H-pb)+" Z";
  var grid=[0,.5,1].map(function(q){var y=pt+q*(H-pt-pb);return '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'}).join("");
  var pc=(last/first-1)*100;
  return '<div class="big">'+f(last)+' <span style="font-size:14px;color:'+col+';font-weight:600">'+(up?"▲ +":"▼ −")+Math.abs(pc).toFixed(2).replace(".",",")+'%</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Grafik '+esc(label)+' dari '+dShort(isoDay(new Date(t0)))+' sampai '+dShort(isoDay(new Date(t1)))+', dari '+esc(f(first))+' menjadi '+esc(f(last))+'">'+grid+
    '<path d="'+area+'" fill="'+col+'" opacity=".12"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>'+
    '<div class="st"><span>Terendah <b>'+f(lo)+'</b></span><span>Tertinggi <b>'+f(hi)+'</b></span><span>'+dShort(isoDay(new Date(t0)))+' sampai '+dShort(isoDay(new Date(t1)))+'</span></div>';
}

  h+=navCard();

  h+='<p class="disc">Halaman ini bersifat edukasi dan contoh alokasi umum berdasarkan data Anda, bukan nasihat investasi. Aplikasi ini bukan penasihat investasi berizin OJK. Status kesesuaian syariah dapat berubah, jadi pastikan produk dan penerbitnya tercatat di OJK dan memiliki fatwa DSN-MUI sebelum membeli. Investasi mengandung risiko, termasuk kerugian nilai.</p>';
  return h;
}

function monthBox(){return '<label class="mo"><span>Periode</span><input type="month" id="mo" value="'+month+'"></label>'}

function donutCard(title,list,type,emptyMsg){
  var tot=list.reduce(function(a,x){return a+x[1]},0);
  var h='<div class="card"><div class="card-h"><h2>'+title+'</h2></div>';
  if(!tot)return h+'<div class="empty">'+emptyMsg+'</div></div>';
  var acc=0,stops=list.map(function(x){var s=acc/tot*100;acc+=x[1];return catColor(type,x[0])+" "+s+"% "+(acc/tot*100)+"%"}).join(",");
  h+='<div class="pad"><div class="dn"><div class="donut" style="background:conic-gradient('+stops+')" role="img" aria-label="'+esc(title)+'"><div><span>Total</span><b>'+compact(tot)+'</b></div></div><div class="lgd">';
  h+=list.map(function(x){return '<div class="lg"><span class="sw" style="background:'+catColor(type,x[0])+'"></span><span>'+esc(x[0])+' <em>'+Math.round(x[1]/tot*100)+'%</em></span><b>'+rp(x[1])+'</b></div>'}).join("");
  return h+'</div></div></div></div>';
}
function cashflowCard(){
  var ms=lastMonths(month,6),data=ms.map(function(m){return[m,sum("in",m),sum("out",m)]}),mx=0;
  data.forEach(function(d){mx=Math.max(mx,d[1],d[2])});
  var h='<div class="card"><div class="card-h"><h2>Arus kas 6 bulan</h2><span>sampai '+monthLabel(month)+'</span></div>';
  if(!mx)return h+'<div class="empty">Belum ada pemasukan atau pengeluaran untuk ditampilkan.</div></div>';
  h+='<div class="bars">'+data.map(function(d){return '<div class="bc'+(d[0]===month?' cur':'')+'"><div class="pair"><i class="a" style="height:'+(d[1]/mx*118)+'px" title="Pemasukan '+rp(d[1])+'"></i><i class="b" style="height:'+(d[2]/mx*118)+'px" title="Pengeluaran '+rp(d[2])+'"></i></div><span>'+monthShort(d[0])+'</span></div>'}).join("")+'</div>';
  return h+'<div class="leg"><span><i style="background:var(--in)"></i>Pemasukan</span><span><i style="background:var(--out)"></i>Pengeluaran</span></div></div>';
}
function recentCard(){
  var list=S.items.filter(function(x){return x.type==="in"||x.type==="out"||x.type==="tf"}).sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)}).slice(0,8);
  var h='<div class="card"><div class="card-h"><h2>Mutasi terakhir</h2></div>';
  if(!list.length)return h+'<div class="empty">Belum ada mutasi. Gunakan menu cepat di atas untuk mencatat transaksi pertama Anda.</div></div>';
  h+='<div class="tbl"><div class="tr th rc"><div>Tanggal</div><div>Keterangan</div><div>Jenis</div><div class="r">Jumlah</div></div>';
  h+=list.map(function(x){var inn=x.type==="in",d=descOf(x),lab=inn?"Pemasukan":x.type==="out"?"Pengeluaran":"Transfer";return '<div class="tr rc"><div class="c-d">'+dShort(x.date)+'</div><div><div class="tn">'+(x.type==="tf"?esc(d.t):d.t)+'</div><div class="msub">'+(x.type==="tf"?esc(d.s):d.s)+' · '+dShort(x.date)+'</div></div><div class="c-k"><span class="tag '+x.type+'">'+lab+'</span></div><div class="amt r '+x.type+'">'+(inn?"+":x.type==="out"?"−":"")+rp(x.amount)+'</div></div>'}).join("");
  return h+'</div></div>';
}

function summaryView(){
  var i=sum("in",month),o=sum("out",month),bal=i-o;
  return (S.items.length?'':welcomeBanner())+'<section class="acct">'+coinStack()+'<div class="al">Total aset</div><div class="ab"><small>Rp</small><span id="tot">'+num(sum("as"))+'</span></div><div class="au">Posisi per '+new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})+'</div>'+
    '<div class="stats"><div class="i"><span>Pemasukan</span><b>'+rp(i)+'</b></div><div class="o"><span>Pengeluaran</span><b>'+rp(o)+'</b></div><div><span>Saldo bulan ini</span><b>'+(bal<0?"−":"")+rp(Math.abs(bal))+'</b></div></div></section>'+
    '<div class="quick"><button data-tab="in"><span class="ic">'+ICON.in+'</span>Catat pemasukan</button><button data-tab="out"><span class="ic">'+ICON.out+'</span>Catat pengeluaran</button><button data-tab="tf"><span class="ic">'+ICON.tf+'</span>Transfer</button><button data-tab="as"><span class="ic">'+ICON.as+'</span>Catat aset</button></div>'+
    goldLine()+'<div class="grid2">'+cashflowCard()+donutCard("Pengeluaran per kategori",byCat("out",month),"out","Belum ada pengeluaran pada periode ini.")+'</div>'+
    recentCard()+
    '<div style="height:16px"></div>'+donutCard("Aset per kategori",byCat("as"),"as","Belum ada aset yang dicatat.");
}

function acts(id){return '<div class="acts"><button class="del ed" data-edit="'+id+'" aria-label="Ubah catatan">'+ICON.edit+'</button><button class="del" data-del="'+id+'" aria-label="Hapus catatan">'+ICON.x+'</button></div>'}
function accOpts(sel,none){
  return (none?'<option value="">Tidak dikaitkan ke rekening</option>':'')+accts().map(function(a){return '<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.note||a.cat)+' ('+rp(valueOf(a))+')</option>'}).join("");
}
function formHead(){
  return '<h2 style="font-size:16px;font-weight:600">'+(editId?"Ubah catatan":FORMT[tab])+'</h2>';
}
function formFoot(){
  return '<button class="btn" data-add="1">'+(editId?"Simpan perubahan":BTN[tab])+'</button>'+(editId?'<button class="btn sec cn" data-cancel="1">Batal</button>':'');
}
function tfView(){
  var list=S.items.filter(function(x){return x.type==="tf"&&x.date.slice(0,7)===month}).sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)});
  var ac=accts(),form;
  if(ac.length<2){
    form='<div class="card form"><div class="pad">'+formHead()+'<p class="hint">Transfer memindahkan uang antar rekening atau dompet, misalnya BCA ke uang tunai saat tarik tunai. Transfer tidak dihitung sebagai pemasukan atau pengeluaran.</p><p class="hint">Buat dulu minimal dua aset kategori Kas/Bank di menu Aset, misalnya "BCA" dan "Uang tunai".</p><div class="fg"><button class="btn" data-tab="as">Ke menu Aset</button></div></div></div>';
  }else{
    var fr=ac[0].id,to=ac[1].id;
    form='<div class="card form"><div class="pad">'+formHead()+'<div class="fg">'+
      '<label class="f"><span>Tanggal</span><input type="date" id="f-date" value="'+today()+'"></label>'+
      '<label class="f"><span>Dari</span><select id="tf-from">'+accOpts(fr,false)+'</select></label>'+
      '<label class="f"><span>Ke</span><select id="tf-to">'+accOpts(to,false)+'</select></label>'+
      '<label class="f"><span>Jumlah</span><div class="af"><em>Rp</em><input type="number" id="f-amt" inputmode="decimal" min="0" placeholder="0"></div></label>'+
      '<label class="f"><span>Keterangan</span><input type="text" id="f-note" placeholder="Contoh: Tarik tunai ATM"></label>'+
      '<div class="err" id="tf-err" role="alert"></div>'+formFoot()+'</div></div></div>';
  }
  var rows=list.length?list.map(function(x){var d=descOf(x);
    return '<div class="tr"><div class="c-d">'+dShort(x.date)+'</div><div><div class="tn">'+esc(d.t)+'</div><div class="msub">'+esc(d.s)+' · '+dShort(x.date)+'</div></div><div class="c-k"><span class="tag tf">Transfer</span></div><div class="amt c-a r tf">'+rp(x.amount)+'</div>'+acts(x.id)+'</div>'}).join(""):'<div class="empty">'+EMPTY.tf+'</div>';
  var table='<div class="card"><div class="card-h"><h2>'+LISTT.tf+'</h2><b class="tf" style="color:var(--blue)">'+rp(list.reduce(function(a,x){return a+x.amount},0))+'</b></div><div class="tbl">'+
    (list.length?'<div class="tr th"><div>Tanggal</div><div>Rekening</div><div>Jenis</div><div class="r">Jumlah</div><div></div></div>':'')+rows+'</div></div>';
  return '<div class="two">'+form+table+'</div>';
}
function listView(){
  if(tab==="tf")return tfView();
  var isA=tab==="as",list=S.items.filter(function(x){return x.type===tab&&(isA||x.date.slice(0,7)===month)}).sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)});
  var cls=tab,sign=tab==="in"?"+":tab==="out"?"−":"";
  var accField="";
  if(!isA){
    accField=accts().length?'<label class="f"><span>Rekening / dompet</span><select id="f-acc">'+accOpts(accSel,true)+'</select></label>':'';
  }
  var form='<div class="card form"><div class="pad">'+formHead()+'<div class="fg">'+
    (isA?'':'<label class="f"><span>Tanggal</span><input type="date" id="f-date" value="'+today()+'"></label>')+
    '<label class="f"><span>Kategori</span><select id="f-cat">'+CATS[tab].map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></label>'+
    accField+
    (isA?goldFields():'')+'<label class="f"><span id="amt-l">'+(isA?"Nilai":"Jumlah")+'</span><div class="af"><em>Rp</em><input type="number" id="f-amt" inputmode="decimal" min="0" placeholder="0"></div></label>'+
    '<label class="f"><span>'+(isA?"Nama aset":"Keterangan")+'</span><input type="text" id="f-note" placeholder="'+(isA?"Contoh: Tabungan BCA":"Contoh: Makan siang")+'"></label>'+
    formFoot()+'</div>'+
    (!isA&&!accts().length?'<p class="hint">Tip: catat aset Kas/Bank (misalnya BCA) di menu Aset, lalu pilih rekening di sini agar saldonya berubah otomatis.</p>':'')+
    (isA?'<p class="hint">Untuk rekening atau dompet, nilai ini menjadi saldo awal. Pemasukan, pengeluaran, dan transfer yang dikaitkan akan menyesuaikan saldonya otomatis.</p>':'')+
    '</div></div>';
  var rows=list.length?list.map(function(x){
    var d=descOf(x),extra="";
    if(isA&&!(x.grams>0)){var m=mv(x.id);if(m!==0)extra='<div class="gd">Saldo awal '+rp(x.amount)+' · mutasi '+(m>=0?"+":"−")+rp(Math.abs(m))+'</div>'}
    return '<div class="tr'+(isA?' na':'')+'">'+(isA?'':'<div class="c-d">'+dShort(x.date)+'</div>')+
    '<div><div class="tn">'+d.t+'</div><div class="msub">'+d.s+(isA?'':' · '+dShort(x.date))+'</div>'+goldDetail(x)+extra+'</div>'+
    '<div class="c-k"><span class="pill"><span class="sw" style="background:'+catColor(tab,x.cat)+'"></span>'+esc(x.cat)+'</span></div>'+
    '<div class="amt c-a r '+cls+'">'+sign+rp(valueOf(x))+'</div>'+acts(x.id)+'</div>'}).join(""):'<div class="empty">'+EMPTY[tab]+'</div>';
  var table='<div class="card"><div class="card-h"><h2>'+LISTT[tab]+'</h2><b class="'+cls+'">'+rp(list.reduce(function(a,x){return a+valueOf(x)},0))+'</b></div><div class="tbl">'+
    (list.length?'<div class="tr th'+(isA?' na':'')+'">'+(isA?'':'<div>Tanggal</div>')+'<div>Keterangan</div><div>Kategori</div><div class="r">Jumlah</div><div></div></div>':'')+rows+'</div></div>';
  return (isA?goldCard():'')+'<div class="two">'+form+table+'</div>';
}

function startEdit(id){
  var x=S.items.filter(function(i){return i.id===id})[0];if(!x)return;
  editId=id;tab=x.type;if(x.type==="in"||x.type==="out"||x.type==="tf")month=x.date.slice(0,7);
  render();
  function set(sel,v){var e=$(sel);if(e&&v!==undefined&&v!==null)e.value=v}
  set("#f-date",x.date);
  if(x.type==="tf"){set("#tf-from",x.from);set("#tf-to",x.to)}
  else{
    set("#f-cat",x.cat);
    if(x.type==="as"){
      toggleGold(false);
      if(x.grams>0){set("#f-br",x.brand);toggleGold(true);set("#f-gr",x.grams);if(x.karat)set("#f-kt",x.karat)}
    }else set("#f-acc",x.acc||"");
  }
  var amt=(x.type==="as"&&!(x.grams>0))?valueOf(x):x.amount;
  set("#f-amt",amt>0?Math.round(amt*100)/100:"");
  if(x.type==="as"&&!(x.grams>0)){var l=$("#amt-l");if(l)l.textContent="Saldo saat ini"}
  set("#f-note",x.note||"");
  window.scrollTo(0,0);
}
function addOrSave(){
  var err=$("#tf-err");if(err)err.textContent="";
  var it,amt=parseFloat($("#f-amt").value),d=$("#f-date"),date=d&&d.value?d.value:today(),old=editId?S.items.filter(function(i){return i.id===editId})[0]:null;
  if(tab==="tf"){
    var fr=$("#tf-from"),to=$("#tf-to");if(!fr||!to)return;
    if(!(amt>0)){$("#f-amt").focus();return}
    if(fr.value===to.value){if(err)err.textContent="Rekening asal dan tujuan tidak boleh sama.";return}
    it={id:old?old.id:String(Date.now())+Math.random().toString(36).slice(2,6),type:"tf",date:date,amount:amt,cat:"Transfer",from:fr.value,to:to.value,note:$("#f-note").value.trim()};
  }else{
    var cv=$("#f-cat").value,isG=tab==="as"&&(cv==="Emas"||cv==="Perak"),gr=0,kt=24,br="";
    if(isG){gr=parseFloat($("#f-gr").value);br=$("#f-br").value;kt=br==="au-lain"?(parseInt($("#f-kt").value,10)||24):24;if(!(gr>0)){$("#f-gr").focus();return}if(!(amt>0))amt=0}
    else if(!(amt>0)){$("#f-amt").focus();return}
    it={id:old?old.id:String(Date.now())+Math.random().toString(36).slice(2,6),type:tab,date:tab==="as"?(old?old.date:today()):date,amount:amt,cat:cv,note:$("#f-note").value.trim()};
    if(gr>0){it.grams=gr;it.brand=br;if(br==="au-lain")it.karat=kt}
    if(tab==="as"&&!isG&&old)it.amount=amt-mv(old.id);
    if(tab!=="as"){var ac=$("#f-acc");if(ac&&ac.value&&accts().some(function(a){return a.id===ac.value})){it.acc=ac.value;accSel=ac.value}else if(ac){accSel=""}}
  }
  if(old)S.items=S.items.map(function(i){return i.id===old.id?it:i});else S.items.push(it);
  editId="";save();render();
}

function renderLogin(){
  $("#root").innerHTML='<div class="auth"><aside class="auth-l"><div>'+LOGOT+'</div><div><h1>Kelola keuangan pribadi dengan rapi.</h1><p>Catat pemasukan, pengeluaran, dan aset dalam satu tempat. Buka dari HP maupun komputer, datanya selalu sama.</p></div><div class="il-wrap">'+illus()+'</div></aside>'+
  '<section class="auth-r"><form onsubmit="return false"><h2>Masuk ke akun Anda</h2><p class="sub">Gunakan email dan kata sandi yang sama di semua perangkat.</p>'+
  '<label class="f"><span>Email</span><input type="email" id="em" autocomplete="email" inputmode="email"></label>'+
  '<label class="f"><span>Kata sandi (minimal 6 karakter)</span><input type="password" id="pw" autocomplete="current-password"></label>'+
  '<div id="lm" role="alert"></div>'+
  '<button class="btn" data-login="in">Masuk</button><button class="btn sec" data-login="up">Daftar akun baru</button>'+
  '<div class="lock">'+ICON.lock+'<span>Data hanya dapat diakses oleh akun Anda.</span></div><div id="st"></div></form></section></div>';
  status(lastStatus);
}

function render(){
  if(sb&&!user){renderLogin();return}
  var keys=Object.keys(TITLE);
  var nav=keys.map(function(k){return '<button data-tab="'+k+'" class="'+(k===tab?"on":"")+'"'+(k===tab?' aria-current="page"':'')+'>'+ICON[k]+TITLE[k]+'</button>'}).join("");
  var navB=keys.map(function(k){return '<button data-tab="'+k+'" class="'+(k===tab?"on":"")+'"'+(k===tab?' aria-current="page"':'')+'>'+ICON[k]+SHORT[k]+'</button>'}).join("");
  var email=user?esc(user.email):"Mode lokal";
  var showMonth=tab!=="as"&&tab!=="inv";
  $("#root").innerHTML=
  '<div class="shell"><aside class="side">'+LOGOT+'<nav aria-label="Menu utama">'+nav+'</nav><div class="foot"><b>'+email+'</b>'+(sb?'<button class="ghost-w" data-out="1">'+ICON.logout+'Keluar</button>':"")+'</div></aside>'+
  '<div><div class="mtop">'+LOGOT+(sb?'<button class="ghost-w" data-out="1" aria-label="Keluar">'+ICON.logout+'Keluar</button>':"")+'</div>'+
  '<main class="main"><div class="pg-h"><div><div class="greet">'+greeting()+'</div><h1>'+TITLE[tab]+'</h1></div>'+(showMonth?monthBox():"")+'</div>'+
  (tab==="sum"?summaryView():tab==="inv"?invView():listView())+'<div id="st"></div></main></div></div>'+
  '<nav class="bnav" aria-label="Menu utama">'+navB+'</nav>';
  status(lastStatus);
  if(tab==="sum"&&firstSummary){firstSummary=false;animateTo($("#tot"),sum("as"))}
}

async function auth(mode){
  var e=$("#em").value.trim(),p=$("#pw").value,m=$("#lm");
  if(!e||p.length<6){m.textContent="Isi email dan kata sandi (minimal 6 karakter).";return}
  m.style.color="var(--muted)";m.textContent="Memproses...";
  var r=mode==="up"?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){m.style.color="var(--out)";m.textContent=r.error.message;return}
  if(!r.data.session){m.style.color="var(--out)";m.textContent="Akun dibuat, tapi Supabase masih meminta konfirmasi email. Matikan 'Confirm email' di Authentication > Sign In / Providers > Email, lalu klik Masuk.";return}
  user=r.data.user;await loadData();render();
}

document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.login)auth(b.dataset.login);
  else if(b.dataset.gref)fetchGold(true);
  else if(b.dataset.chart){CHSEL=b.dataset.chart;render();loadChart(false)}
  else if(b.dataset.chr){CHR=parseInt(b.dataset.chr,10);render();loadChart(false)}
  else if(b.dataset.chrefresh)loadChart(true);
  else if(b.dataset.chsym){var sy=($("#ch-sym").value||"").trim().toUpperCase().replace(/\.JK$/,"");if(!/^[A-Z0-9]{2,6}$/.test(sy)){$("#ch-sym").focus();return}CHSYM=sy;render();loadChart(false)}
  else if(b.dataset.nvsel){NVSEL=b.dataset.nvsel;render()}
  else if(b.dataset.nvadd){
    var nn=($("#nv-name").value||"").trim(),vv=parseFloat($("#nv-val").value),dd=$("#nv-date").value||today();
    if(!nn){$("#nv-name").focus();return}if(!(vv>0)){$("#nv-val").focus();return}
    S.items.push({id:String(Date.now())+Math.random().toString(36).slice(2,6),type:"nav",cat:$("#nv-kind").value,note:nn,date:dd,amount:vv});
    NVSEL=nn;save();render()}
  else if(b.dataset.risk){RISK=b.dataset.risk;lsWrite("riskProf",RISK);render()}
  else if(b.dataset.gsave)savePrice();
  else if(b.dataset.gdel)clearPrice(b.dataset.gdel);
  else if(b.dataset.gedit)editBrand(b.dataset.gedit);
  else if(b.dataset.out){sb.auth.signOut().then(function(){user=null;S.items=[];status("");render()})}
  else if(b.dataset.tab){editId="";tab=b.dataset.tab;render();window.scrollTo(0,0);if(tab==="inv")loadChart(false)}
  else if(b.dataset.edit)startEdit(b.dataset.edit);
  else if(b.dataset.cancel){editId="";render()}
  else if(b.dataset.del){
    var tg=S.items.filter(function(x){return x.id===b.dataset.del})[0];
    var linked=tg&&tg.type==="as"&&!(tg.grams>0)&&S.items.some(function(x){return x.acc===tg.id||x.from===tg.id||x.to===tg.id});
    if(!confirm(linked?"Rekening ini punya pemasukan, pengeluaran, atau transfer yang dikaitkan. Hapus tetap? Catatan tersebut tetap ada tetapi tidak lagi mengubah saldo.":"Hapus catatan ini?"))return;
    if(editId===b.dataset.del)editId="";
    S.items=S.items.filter(function(x){return x.id!==b.dataset.del});save();render()}
  else if(b.dataset.add)addOrSave();
});
document.addEventListener("change",function(e){if(e.target.id==="mo"&&e.target.value){month=e.target.value;render()}if(e.target.id==="f-cat")toggleGold(false);if(e.target.id==="f-br")toggleGold(true);
  if(e.target.id==="g-br"){var en=PB[e.target.value]||{};$("#g-bb").value=en.bb>0?Math.round(en.bb):"";$("#g-jl").value=en.jl>0?Math.round(en.jl):""}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.target.id==="pw"||e.target.id==="em"))auth("in")});

fetchGold(false);
(async function(){
  var ready=window.supabase&&SB_URL.indexOf("ISI_")!==0&&SB_KEY.indexOf("ISI_")!==0;
  if(!ready){lsGet();status("Mode lokal: data hanya di browser ini (Supabase belum diisi)");APPREADY=true;render();return}
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  var s=await sb.auth.getSession();
  if(s.data&&s.data.session){user=s.data.session.user;await loadData()}
  APPREADY=true;
  render();
})();
</script>
